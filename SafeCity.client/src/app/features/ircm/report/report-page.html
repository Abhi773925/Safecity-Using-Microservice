<div class="min-h-screen bg-slate-50 pt-16">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid gap-6 lg:grid-cols-[240px_minmax(0,1fr)]">

      <app-sidebar></app-sidebar>

      <main class="min-w-0 space-y-6 pb-8">
        <div class="border border-slate-200 bg-slate-900 p-4 sm:p-5 text-white shadow-sm">
          <p class="text-[10px] font-bold uppercase tracking-wider text-sky-200">IRCM / Incidents</p>
          <h2 class="mt-1 text-lg sm:text-xl font-bold uppercase tracking-tight text-white">Report Incident</h2>
          <p class="mt-1 text-sm text-slate-300">Create a new incident record.</p>
        </div>

        @if (message) {
          <div class="px-3 py-2 text-sm border"
            [class.border-emerald-200]="!isError" [class.bg-emerald-50]="!isError" [class.text-emerald-800]="!isError"
            [class.border-rose-200]="isError" [class.bg-rose-50]="isError" [class.text-rose-800]="isError">
            {{ message }}
          </div>
        }

        <div class="grid gap-4 xl:grid-cols-12">
          <section class="xl:col-span-7 border border-slate-200 bg-white p-4 sm:p-5 shadow-sm space-y-3">
            <h3 class="text-sm font-bold uppercase tracking-tight text-slate-900">Incident Form</h3>

            <div class="grid gap-3 sm:grid-cols-2">
              <div class="space-y-1">
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Incident Type</label>
                <select class="w-full border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900" [(ngModel)]="type">
                  @for (opt of typeOptions; track opt.value) {
                    <option [value]="opt.value">{{ opt.label }}</option>
                  }
                </select>
              </div>
              <div class="space-y-1">
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Location</label>
                <input type="text" placeholder="Enter landmark or address" class="w-full border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900" [(ngModel)]="location" />
              </div>
            </div>

            <button type="button" class="border border-slate-900 bg-slate-900 px-4 py-2.5 text-sm font-bold uppercase tracking-wider text-white cursor-pointer hover:bg-slate-800 disabled:opacity-60" (click)="submit()" [disabled]="submitting">
              {{ submitting ? 'Submitting...' : 'Submit Incident' }}
            </button>
          </section>

          <section class="xl:col-span-5 border border-slate-200 bg-white p-4 sm:p-5 shadow-sm">
            <h3 class="text-sm font-bold uppercase tracking-tight text-slate-900">How it works</h3>
            <ul class="mt-3 space-y-2 text-sm text-slate-600">
              <li>1. Choose the incident type.</li>
              <li>2. Enter the exact location.</li>
              <li>3. Submit to create the record.</li>
            </ul>
          </section>
        </div>
      </main>
    </div>
  </div>
</div>
