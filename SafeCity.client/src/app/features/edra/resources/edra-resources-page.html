<div class="min-h-screen bg-slate-50 pt-16">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid gap-6 lg:grid-cols-[240px_minmax(0,1fr)]">
      <app-sidebar></app-sidebar>
      <main class="min-w-0 space-y-4 pb-8">
<section class="border border-slate-200 bg-white p-4 sm:p-5 shadow-sm space-y-4">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">EDRA Module</p>
                    <h2 class="mt-1 text-sm font-bold uppercase tracking-tight text-slate-900">Resource Management</h2>
                </div>
                <div class="hidden sm:block text-right">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Access</p>
                    <p class="mt-1 text-sm font-bold text-slate-900">{{ dispatcherAccess ? 'Dispatcher' : 'Viewer' }}</p>
                </div>
            </div>

            <app-edra-resources
                [resources]="filteredResources"
                [loading]="loading"
                [dispatcherAccess]="dispatcherAccess"
                [searchText]="searchText"
                [newResourceType]="newResourceType"
                [newResourceLocation]="newResourceLocation"
                [submitting]="submitting"
                (addResource)="addResource()"
                (updateResource)="updateResourceEvent($event)"
            ></app-edra-resources>
        </section>
      </main>
    </div>
  </div>
</div>
