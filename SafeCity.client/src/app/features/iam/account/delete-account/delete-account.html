<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 pt-20">
	<div class="w-full max-w-md">
	<!-- Header -->
	<div class="mb-8">
		<h2 class="text-center text-xl font-semibold text-slate-900 mb-2">Delete Account</h2>
		<p class="text-center text-sm text-slate-600">This action permanently removes your account and cannot be undone.</p>
	</div>

	<!-- Card -->
	<div class="bg-white border border-slate-200 rounded-lg p-8 shadow-sm">
			<!-- Danger Alert -->
			<div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-slate-700 mb-5">
				Make sure you really want to continue.
			</div>

			<!-- Warning List -->
			<ul class="mb-5 space-y-2 text-sm text-slate-600">
				<li class="flex gap-2">
					<span class="text-red-600 font-bold">•</span>
					<span>Your profile data will be removed.</span>
				</li>
				<li class="flex gap-2">
					<span class="text-red-600 font-bold">•</span>
					<span>Access tokens will be cleared from this device.</span>
				</li>
				<li class="flex gap-2">
					<span class="text-red-600 font-bold">•</span>
					<span>You may need support to restore access.</span>
				</li>
			</ul>

			<!-- Delete Button -->
			<button
				type="button"
				class="w-full px-4 py-2 bg-slate-600 text-white font-semibold cursor-pointer hover:bg-slate-red-700 transition-colors"
				(click)="deleteAccountBody()"
			>
				Delete Account Permanently
			</button>
		</div>
	</div>
</div>
