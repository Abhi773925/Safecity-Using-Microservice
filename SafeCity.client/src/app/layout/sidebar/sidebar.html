<aside class="h-[calc(100vh-5rem)] border border-slate-200 bg-white p-4 shadow-sm lg:sticky lg:top-20  overflow-y-auto">

  <!-- Module Navigation -->
  <div>
    <p class="px-1 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">Navigation</p>
    <nav class="space-y-1">
      @for (link of moduleLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-slate-900 text-white"
          class="block border border-slate-200 px-4 py-2.5 text-sm font-bold uppercase tracking-wide text-slate-700 transition-colors hover:border-slate-900 hover:bg-slate-100"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </div>

  <!-- Account Links -->
  @if (crossLinks.length > 0) {
    <div class="border-t border-slate-200 pt-4 mt-4">
      <p class="px-1 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">Account</p>
      <nav class="space-y-1">
        @for (link of crossLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-slate-900 text-white"
            class="block border border-slate-200 px-4 py-2.5 text-sm font-bold uppercase tracking-wide text-slate-700 transition-colors hover:border-slate-900 hover:bg-slate-100"
          >
            {{ link.label }}
          </a>
        }
      </nav>
    </div>
  }

</aside>
